
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamera Pengambilan OMSYS</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 560px;
  margin: auto;
}
video, canvas {
  width: 100%;
  border-radius: 12px;
  background: #000;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
#ambil { background: #dc2626; color: white; }
#ulang { background: #374151; color: white; }
#status { line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h2>Bukti Pengambilan Barang</h2>
  <p id="status">Memeriksa permintaan dari OMSYS...</p>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <button id="ambil" disabled>Ambil Foto</button>
  <button id="ulang" hidden>Ambil Ulang</button>
</main>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const tombolAmbil = document.getElementById('ambil');
const tombolUlang = document.getElementById('ulang');

let stream = null;
let nomorFaktur = '';
let fotoSiap = false;

function kirimKeOmsys(data) {
  if (!window.opener || window.opener.closed) {
    throw new Error('Jendela OMSYS tidak ditemukan.');
  }

  window.opener.postMessage({
    type: 'FOTO_PENGAMBILAN',
    nomorFaktur: nomorFaktur,
    dataFoto: data
    }, '*');
}

async function mulaiKamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('Akses kamera tidak tersedia. Periksa HTTPS dan izin browser.');
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });

  video.srcObject = stream;
  await video.play();

  tombolAmbil.disabled = false;
  statusEl.textContent = 'Kamera aktif. Pastikan objek terlihat, lalu ambil foto.';
}

function matikanKamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}


async function ambilDanKirimOtomatis() {
  try {
    tombolAmbil.disabled = true;

    let dataFoto = window.dataFotoSiap || '';

    if (!fotoSiap) {
      statusEl.textContent =
        'Menyiapkan foto otomatis...';

      if (!video.videoWidth || !video.videoHeight) {
        throw new Error('Kamera belum siap.');
      }

      let lebar = Math.min(1280, video.videoWidth);
      let tinggi = Math.round(
        lebar * video.videoHeight / video.videoWidth
      );

      canvas.width = lebar;
      canvas.height = tinggi;

      const ctx = canvas.getContext('2d');

      let berhasil = false;

      while (lebar >= 320 && tinggi >= 240) {
        canvas.width = lebar;
        canvas.height = tinggi;

        ctx.drawImage(video, 0, 0, lebar, tinggi);

        for (const kualitas of [0.7, 0.6, 0.5]) {
          dataFoto = canvas.toDataURL(
            'image/jpeg',
            kualitas
          );

          const ukuran = Math.floor(
            (dataFoto.split(',')[1] || '').length * 3 / 4
          );

          if (ukuran <= 1800 * 1024) {
            berhasil = true;
            break;
          }
        }

        if (berhasil) break;

        lebar = Math.floor(lebar * 0.85);
        tinggi = Math.floor(tinggi * 0.85);
      }

      if (!berhasil) {
        throw new Error(
          'Foto gagal dikompres ke ukuran yang diizinkan.'
        );
      }

      window.dataFotoSiap = dataFoto;
      fotoSiap = true;

      matikanKamera();

      video.hidden = true;
      canvas.hidden = false;
    }

    statusEl.textContent =
      'Foto berhasil diambil. Mengirim ke OMSYS...';

    tombolAmbil.textContent = 'Mengirim Foto...';

    kirimKeOmsys(dataFoto);

    statusEl.textContent =
      'Foto dikirim. Menunggu konfirmasi penyimpanan Google Drive...';

  } catch (e) {
    statusEl.textContent =
      e.message || 'Gagal mengambil atau mengirim foto.';

    tombolAmbil.textContent = 'Coba Lagi';
    tombolAmbil.disabled = false;
  }
}

// Tombol hanya menjadi pilihan pemulihan jika proses otomatis gagal.
tombolAmbil.addEventListener('click', function() {
  ambilDanKirimOtomatis();
});


window.addEventListener('message', function(event) {
  if (event.source !== window.opener) return;

  if (event.data?.type !== 'FOTO_PENGAMBILAN_HASIL') {
    return;
  }

  if (event.data.success === true) {
    statusEl.textContent =
      'Foto berhasil disimpan ke Google Drive.';

    tombolAmbil.textContent = 'Foto Tersimpan';
    tombolAmbil.disabled = true;
    tombolUlang.hidden = true;
  } else {
    statusEl.textContent =
      event.data.message || 'Foto gagal disimpan.';
  
    tombolAmbil.textContent = 'Kirim Ulang Foto';
    tombolAmbil.disabled = false;
  }
});

window.addEventListener('beforeunload', matikanKamera);

const parameter = new URLSearchParams(location.search);
nomorFaktur = parameter.get('faktur') || '';

if (nomorFaktur) {
  mulaiKamera()
    .then(() => {
      statusEl.textContent =
        'Kamera aktif. Foto akan diambil otomatis...';

      // Beri waktu kamera menampilkan gambar dengan stabil.
      setTimeout(ambilDanKirimOtomatis, 1500);
    })
    .catch(e => {
      statusEl.textContent =
        e.message || 'Kamera tidak dapat dibuka.';

      tombolAmbil.textContent = 'Coba Lagi';
      tombolAmbil.disabled = false;
    });
} else {
  statusEl.textContent =
    'Buka halaman ini dari tombol Pengambilan Barang di OMSYS.';
}
</script>
</body>
</html>
